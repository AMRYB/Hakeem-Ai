[project]
name = "grounded-ddi-assistant"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
